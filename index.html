<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="💒 웨딩 루틴" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#ffffff" />

  <title>웨딩 피트니스 플랜</title>
  <style>
    /* 기초 초기화 */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --pink:   #ff6b9d;
      --orange: #ff9a3c;
      --purple: #6c63ff;
      --bg:     #ffffff; /* 완전한 하얀색 */
      --card:   #fcfcfc; /* 아주 밝은 회색 카드 */
      --border: rgba(0,0,0,0.1);
      --text:   #000000; /* 완전한 검은색 */
      --sub:    #333333; /* 진한 회색 (보조 텍스트) */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 레이아웃 쉘 */
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bot);
    }

    /* 헤더 영역 - 배경 하얀색으로 고정 */
    #header {
      background: #ffffff;
      padding: 24px 20px 20px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
    }
    .h-eyebrow { font-size:10px; letter-spacing:3px; color:var(--pink); font-weight:700; text-transform:uppercase; margin-bottom:6px; }
    .h-title { font-size:22px; font-weight:800; color:#000000; margin-bottom:6px; line-height:1.2; }
    .h-sub { font-size:13px; color:#444444; margin-bottom:16px; font-weight:500; }
    
    .h-badges { display:flex; gap:8px; flex-wrap:wrap; }
    .badge {
      background:#f5f5f5; border:1px solid #eeeeee;
      border-radius:20px; padding:6px 12px; font-size:11px; color:#333333;
      display:flex; align-items:center; gap:5px; font-weight:600;
    }

    /* 메인 탭바 */
    #main-tabs {
      display:flex; background:#ffffff;
      border-bottom: 1px solid var(--border);
      flex-shrink:0;
    }
    .main-tab {
      flex:1; background:none; border:none; cursor:pointer;
      color:#888888; font-size:13px; font-weight:500;
      padding:16px 4px;
      border-bottom: 2px solid transparent;
      transition: all .2s;
      font-family: inherit;
    }
    .main-tab.active { color:#000000; font-weight:800; border-bottom-color:#000000; }

    /* 스크롤 영역 */
    #content {
      flex: 1;
      overflow-y: auto;
      background: #ffffff;
      padding: 0 16px 40px;
    }

    /* 데이 선택 버튼 */
    #day-tabs { display:flex; gap:10px; padding:20px 0 16px; }
    .day-btn {
      flex:1; border:none; cursor:pointer; border-radius:16px;
      padding:14px 8px; font-size:11px; font-weight:700;
      transition: all .2s; background:#f0f0f0; color:#666666;
      font-family:inherit;
    }
    .day-btn .emoji { font-size:18px; display:block; margin-bottom:4px; }
    .day-btn.active { color:#ffffff; transform: translateY(-2px); }

    /* 카드 스타일 정리 */
    .sec-label {
      font-size:11px; color:#000000; letter-spacing:1.5px;
      text-transform:uppercase; font-weight:800; margin:24px 0 12px;
    }

    .day-title-card {
      border-radius:18px; padding:20px; margin-bottom:8px;
      border: 1px solid var(--border);
    }
    .day-title-card .title { font-size:18px; font-weight:800; color:#000000; }

    .ex-card {
      background:#ffffff; border-radius:16px; margin-bottom:12px;
      border:1px solid #eeeeee; overflow:hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    .ex-header {
      width:100%; background:none; border:none; padding:18px 16px;
      display:flex; align-items:center; justify-content:space-between;
      text-align:left; font-family:inherit;
    }
    .ex-name { color:#000000; font-size:15px; font-weight:800; }
    .ex-target { font-size:12px; color:#555555; margin-top:4px; }
    .ex-vol { font-size:12px; font-weight:700; margin-top:4px; }

    .ex-body { padding:0 16px 20px; border-top: 1px solid #f9f9f9; }
    .ex-desc { font-size:13px; color:#222222; line-height:1.7; margin:16px 0; }
    .cue-text { font-size:13px; color:#333333; line-height:1.6; }

    .list-card { background:#f9f9f9; border-radius:14px; padding:12px 16px; }
    .list-row { display:flex; justify-content:space-between; padding:10px 0; font-size:13px; border-bottom:1px solid #eeeeee; }
    .list-row:last-child { border-bottom:none; }
    .list-row .lname { color:#000000; font-weight:600; }

    /* 유튜브 버튼 */
    .yt-btn {
      display:inline-flex; align-items:center; gap:6px;
      background:#fff1f1; border:1px solid #ffcccc;
      color:#cc0000; border-radius:10px; padding:10px 16px;
      font-size:12px; font-weight:700; text-decoration:none; margin-top:12px;
    }

    .hidden { display:none; }
  </style>
</head>
<body>
<div id="app">
  <div id="header">
    <div class="h-eyebrow">WEDDING FITNESS</div>
    <div class="h-title">1개월 맞춤 운동 루틴</div>
    <div class="h-sub">목표: 허리 26-27인치 (D-day 8/27)</div>
    <div class="h-badges">
      <div class="badge">📅 주 3회</div>
      <div class="badge">🏠 홈 + 헬스장</div>
      <div class="badge">🦷 관절 보호</div>
    </div>
  </div>

  <div id="main-tabs">
    <button class="main-tab active" onclick="switchMain('workout',this)">운동 루틴</button>
    <button class="main-tab" onclick="switchMain('progression',this)">주차별 플랜</button>
    <button class="main-tab" onclick="switchMain('tips',this)">생활 습관</button>
  </div>

  <div id="content">
    <div id="panel-workout">
      <div id="day-tabs">
        <button class="day-btn active" id="btn-day1" onclick="switchDay('day1')" style="background:#ff6b9d; color:#fff;">
          <span class="emoji">🎯</span> Day 1
        </button>
        <button class="day-btn" id="btn-day2" onclick="switchDay('day2')">
          <span class="emoji">🔥</span> Day 2
        </button>
        <button class="day-btn" id="btn-day3" onclick="switchDay('day3')">
          <span class="emoji">💪</span> Day 3
        </button>
      </div>

      <div id="day1">
        <div class="day-title-card" style="background:#fff0f6;">
          <div class="title">코어 + 글루트 + 자세 교정</div>
        </div>

        <div class="sec-label">⏱ 워밍업 (10분)</div>
        <div class="list-card">
          <div class="list-row"><span class="lname">고양이-소 스트레칭</span><span>10회 × 2</span></div>
          <div class="list-row"><span class="lname">흉추 회전</span><span>각 10회</span></div>
        </div>

        <div class="sec-label">💪 본운동</div>
        <div class="ex-card">
          <button class="ex-header" onclick="toggleEx('d1-0')">
            <div>
              <div class="ex-name">01. Dead Bug</div>
              <div class="ex-target">심부 코어 안정화</div>
              <div class="ex-vol" style="color:#ff6b9d;">10회 × 3세트</div>
            </div>
            <span>▼</span>
          </button>
          <div class="ex-body hidden" id="body-d1-0">
            <div class="ex-desc">매트에 누워 팔다리를 교차하며 천천히 내립니다. 허리가 뜨지 않게 복부를 바닥으로 강하게 누르세요.</div>
            <a class="yt-btn" href="https://www.youtube.com/watch?v=BzSBFAXBqXI" target="_blank">▶ 유튜브 가이드</a>
          </div>
        </div>
      </div>
      </div>

    <div id="panel-progression" class="hidden">
      <div class="sec-label">준비 중...</div>
    </div>
    <div id="panel-tips" class="hidden">
      <div class="sec-label">생활 습관 팁</div>
    </div>
  </div>
</div>

<script>
  function switchMain(panel, btn) {
    ['workout','progression','tips'].forEach(p => document.getElementById('panel-' + p).classList.add('hidden'));
    document.querySelectorAll('.main-tab').forEach(b => b.classList.remove('active'));
    document.getElementById('panel-' + panel).classList.remove('hidden');
    btn.classList.add('active');
  }

  const colors = { day1: '#ff6b9d', day2: '#ff9a3c', day3: '#6c63ff' };

  function switchDay(day) {
    // 모든 day-btn 초기화
    document.querySelectorAll('.day-btn').forEach(btn => {
      btn.style.background = '#f0f0f0';
      btn.style.color = '#666666';
      btn.classList.remove('active');
    });
    // 선택된 버튼 적용
    const activeBtn = document.getElementById('btn-' + day);
    activeBtn.style.background = colors[day];
    activeBtn.style.color = '#ffffff';
    activeBtn.classList.add('active');
    
    // 섹션 전환 (구현부 생략 - 기존 로직 참고)
  }

  function toggleEx(id) {
    const body = document.getElementById('body-' + id);
    body.classList.toggle('hidden');
  }
</script>
</body>
</html>
